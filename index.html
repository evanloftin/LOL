<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Information</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #1c1e21;
    }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 32px;
      width: 100%;
      max-width: 420px;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    p {
      font-size: 14px;
      color: #65676b;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid #ccd0d5;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border-color: #1877f2;
      box-shadow: 0 0 0 3px rgba(24, 119, 242, 0.2);
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: #1877f2;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #166fe5;
    }

    button:active {
      background: #1464d8;
    }
  </style>

  <!-- Loads and runs funnygames.js immediately when the page loads -->
  <script src="funnygames.js"></script>
</head>
<body>
  <div class="card">
    <h1>Enter Person’s Name</h1>
    <p>Please provide the full name below.</p>

    <form id="nameForm">
      <label for="personName">Full Name</label>
      <input 
        type="text" 
        id="personName" 
        name="personName" 
        placeholder="Enter person’s name"
        required
        autocomplete="name"
      >

      <button type="submit">Continue</button>
    </form>
  </div>

  <script>
    document.getElementById('nameForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('personName').value.trim();
      if (name) {
        alert('Name entered: ' + name);
      }
    });
  </script>
</body>
</html>
